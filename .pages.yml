      - name: starsTextMt
        label: "Method: stars and Google rating (Maltese)"
        type: text
      - name: starsTextMs
        label: "Method: stars and Google rating (Malay)"
        type: text
      - name: starsTextFil
        label: "Method: stars and Google rating (Filipino)"
        type: text
      - name: starsTextVi
        label: "Method: stars and Google rating (Vietnamese)"
        type: text
      - name: starsTextAr
        label: "Method: stars and Google rating (Arabic)"
        type: text
  - name: guides
    label: Guides
    description: Explainer articles at starredbill.com/guides/<file name>/. The file name is the page's address, so don't rename a published guide.
    type: collection
    path: content/guides
    format: json
    filename: "{fields.id}.json"
    operations:
      rename: false
    view:
      primary: h1
      fields: [h1, updated]
    fields:
      - name: id
        label: Web address
        description: Lowercase words joined by hyphens, e.g. what-is-a-michelin-star. Can't change once published.
        type: string
        required: true
      - name: h1
        label: Headline (H1)
        type: string
        required: true
      - name: title
        label: Title in search results
        description: Up to 60 characters.
        type: string
        required: true
      - name: description
        label: Description in search results
        description: Up to 155 characters.
        type: text
        required: true
      - name: summary
        label: One-line summary for the Guides page
        type: string
        required: true
      - name: section
        label: Section on the Guides page
        description: Which group the guide sits in. "What is a Michelin star?" always leads the page on its own.
        type: select
        options:
          values:
            - value: stars
              label: Understanding the stars
            - value: where
              label: Where to find them
            - value: no-stars
              label: No stars yet
      - name: figure
        label: Key figure for the Guides page
        description: One short line shown on the guide's card, e.g. "{{n3UK}} in the UK, dinner from {{cheapest3UKPrice}}". Figures in double curly brackets work as in the article.
        type: string
      - name: places
        label: Destination pages it belongs to
        description: Optional. Places (their file names, e.g. london or uk) where this guide leads the "Related guides" box, on that place and every place inside it. Pages the article links to show it anyway.
        type: string
        list: true
      - name: imageAlt
        label: Picture description
        description: What the guide's featured picture shows, for screen readers and link previews, e.g. "Illustration of a plated tasting course on a cream tablecloth, with a gold star beside it." The picture itself is src/img/guides/<web address>.jpg, made by scripts/guide_images.py (see docs/image-style.md).
        type: string
      - name: published
        label: First published
        description: A date like 2026-10-05.
        type: string
        required: true
      - name: updated
        label: Last updated
        description: Change this whenever you edit the article. A date like 2026-10-05.
        type: string
        required: true
      - name: lang
        label: Spelling
        description: en-US for US spelling, en-GB for UK spelling.
        type: string
      - name: keywords
        label: Target keywords
        description: The searches this page is written for, from its content brief, the main one first. They go into the page's keywords tags, and the build lists any that don't appear in the title, headline, article or FAQ.
        type: string
        list: true
      - name: body
        label: Article
        description: "Figures in double curly brackets, like {{n3}} or {{price1}}, are filled in from the restaurant data when the site is built (README lists them). A line holding just {{table:name}}, like {{table:countries}}, becomes a table built from the restaurant data (README lists them). A link written as <a data-guide=\"name\">…</a> becomes a link once that guide exists."
        type: rich-text
        required: true
      - name: faq
        label: Frequently asked questions
        description: Shown under the article and given to Google as an FAQ.
        type: object
        list: true
        fields:
          - name: q
            label: Question
            type: string
          - name: a
            label: Answer
            type: text
      - name: picks
        label: Restaurant write-ups
        description: For ranked lists such as the top ten most reviewed. The restaurant is its file name, e.g. don-julio.
        type: object
        list: true
        fields:
          - name: restaurant
            label: Restaurant (file name)
            type: string
          - name: text
            label: Write-up
            type: text
  - name: currencies
    label: Currencies
    description: Symbols and fallback exchange rates. Live rates are used when available; these only apply if they can't be fetched.
    type: file
    path: content/currencies.json
    format: json
    fields:
      - name: rateDate
        label: Date of the fallback rates
        type: string
        pattern: { regex: '^\d{4}-\d{2}-\d{2}$', message: "Use year-month-day, e.g. 2026-10-02" }
      - name: switchable
        label: Currencies in the switch
        description: Shown on every page after the local currency, e.g. GBP, EUR, USD.
        type: string
        list: true
      - name: currencies
        label: Currencies
        type: object
        list: true
        fields:
          - name: code
            label: Code
            type: string
            required: true
            pattern: { regex: '^[A-Z]{3}$', message: "Use a three-letter code in capitals, e.g. EUR" }
          - name: symbol
            label: Symbol
            description: e.g. £, €, US$, NT$, ¥, DKK. A symbol made of letters (like DKK) gets a space before the amount.
            type: string
            required: true
          - name: perUSD
            label: Units per 1 US dollar
            description: e.g. 0.76 for pounds, 32 for New Taiwan dollars.
            type: number
            required: true
            options: { min: 0, step: any }

  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: updated
        label: Prices last checked
        description: Year and month, shown on the homepage, e.g. 2026-10.
        type: string
        pattern: { regex: '^\d{4}-\d{2}$', message: "Use year-month, e.g. 2026-10" }
