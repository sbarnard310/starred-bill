<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Compare dinner and wine pairing prices at Michelin-starred restaurants in London and Taiwan.">
<title>The Starred Bill</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500&display=swap">
<style>
/* Layout: deep-green masthead band with headline figures, then a comparison ledger, a stars breakdown, method notes and a contact form, all on one 1120px column. */
:root {
  --bg: #F2F6F1;
  --surface: #FFFFFF;
  --ink: #12261C;
  --muted: #5A6E62;
  --line: #D5E0D6;
  --green: #1E6142;
  --green-soft: #DCEDE1;
  --band: #10362A;
  --band-ink: #EAF4EC;
  --band-muted: #A9C8B4;
  --gold: #B3862B;
  --danger: #A33A2E;
  --danger-soft: #F7E3DF;
  --heart: #C2413A;
  --font-display: "Gloock", "Noto Serif TC", "PingFang TC", Georgia, "Times New Roman", serif;
  --font-body: "Figtree", "Noto Sans TC", "PingFang TC", "Microsoft JhengHei", system-ui, -apple-system, "Segoe UI", sans-serif;
  --font-num: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0C1712; --surface: #13221A; --ink: #E4EEE7; --muted: #98AE9F; --line: #24392D;
    --green: #6FCB97; --green-soft: #1A3527; --band: #0A2219; --band-ink: #E4F1E8; --band-muted: #8FB49C;
    --gold: #E0B85C; --danger: #F08C7E; --danger-soft: #3A1E1A; --heart: #F0857A; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0C1712; --surface: #13221A; --ink: #E4EEE7; --muted: #98AE9F; --line: #24392D;
  --green: #6FCB97; --green-soft: #1A3527; --band: #0A2219; --band-ink: #E4F1E8; --band-muted: #8FB49C;
  --gold: #E0B85C; --danger: #F08C7E; --danger-soft: #3A1E1A; --heart: #F0857A; color-scheme: dark;
}

* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }
img { max-width: 100%; }
html { scroll-behavior: smooth; }
@media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 16px; line-height: 1.55; }
.wrap { max-width: 1120px; margin-inline: auto; padding-inline: 20px; }
h1, h2, h3 { font-family: var(--font-display); font-weight: 400; text-wrap: balance; margin: 0; line-height: 1.1; }
h2 { font-size: clamp(1.7rem, 3.4vw, 2.3rem); }
p { margin: 0; }
.eyebrow { font-size: .75rem; letter-spacing: .12em; text-transform: uppercase; font-weight: 600; color: var(--green); }
.num { font-family: var(--font-num); font-variant-numeric: tabular-nums; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
button, input, select, textarea { font: inherit; color: inherit; }

/* Header */
.site-header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--band); color: var(--band-ink); border-bottom: 1px solid color-mix(in srgb, var(--band-ink) 12%, transparent); }
.site-header .wrap { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding-block: 14px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; color: inherit; text-decoration: none; font-family: var(--font-display); font-size: 1.35rem; }
.brand svg { width: 22px; height: 22px; color: var(--gold); }
.nav { display: flex; gap: 4px; flex-wrap: wrap; }
.nav a { color: var(--band-muted); text-decoration: none; font-size: .9rem; font-weight: 500; padding: 6px 10px; border-radius: 6px; }
.nav a:hover { color: var(--band-ink); background: color-mix(in srgb, var(--band-ink) 10%, transparent); }
.header-actions { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.wish-link { display: inline-flex; align-items: center; gap: 6px; color: var(--band-ink); text-decoration: none; font-size: .9rem; font-weight: 600; padding: 6px 12px; border-radius: 999px; border: 1px solid color-mix(in srgb, var(--band-ink) 25%, transparent); }
.wish-link:hover { background: color-mix(in srgb, var(--band-ink) 10%, transparent); }
.wish-link svg { width: 16px; height: 16px; fill: none; stroke: currentColor; }
.wish-link.has-items svg { fill: var(--heart); stroke: var(--heart); }
.wish-link #wishCount { font-family: var(--font-num); font-weight: 500; }

/* Hero */
.hero { background: var(--band); color: var(--band-ink); padding-block: 48px 56px; }
.hero .wrap { display: grid; grid-template-columns: 1.3fr 1fr; gap: 40px; align-items: end; }
.hero h1 { font-size: clamp(2.2rem, 5.4vw, 3.8rem); }
.hero h1 em { font-style: normal; color: var(--gold); }
.hero p { color: var(--band-muted); margin-top: 16px; max-width: 52ch; }
.figures { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: color-mix(in srgb, var(--band-ink) 16%, transparent); border-radius: var(--radius); overflow: hidden; }
.figure { background: var(--band); padding: 16px 14px; min-width: 0; }
.figure .label { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--band-muted); }
.figure .value { font-family: var(--font-num); font-size: 1.5rem; margin-top: 4px; }
.figure .sub { font-size: .8rem; color: var(--band-muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

section { padding-block: 56px; }
section + section { border-top: 1px solid var(--line); }
section { scroll-margin-top: 64px; }
.section-head { display: flex; justify-content: space-between; align-items: end; gap: 16px; flex-wrap: wrap; margin-bottom: 24px; }
.section-head p { color: var(--muted); max-width: 60ch; margin-top: 8px; }

/* Toolbar */
.toolbar { display: grid; grid-template-columns: 1fr auto; gap: 12px; margin-bottom: 14px; }
.search { position: relative; }
.search svg { position: absolute; left: 14px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; padding: 12px 14px 12px 42px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.search input:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
select { padding: 12px 36px 12px 14px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }

.filters { display: grid; gap: 14px; margin-bottom: 18px; }
.filter-group { display: grid; grid-template-columns: 110px 1fr; gap: 8px 12px; align-items: start; }
.flabel { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; font-weight: 600; color: var(--muted); padding-top: 9px; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; justify-self: start; }
.seg button { border: 0; background: none; cursor: pointer; padding: 7px 14px; display: inline-flex; gap: 6px; align-items: center; font-size: .88rem; font-weight: 500; }
.seg button + button { border-left: 1px solid var(--line); }
.seg button .count { color: var(--muted); font-family: var(--font-num); font-size: .78rem; }
.seg button[aria-pressed="true"] { background: var(--green); color: var(--surface); }
.seg button[aria-pressed="true"] .stars, .seg button[aria-pressed="true"] .count { color: color-mix(in srgb, var(--surface) 80%, transparent); }
.seg .stars svg { width: 13px; height: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip.zero { opacity: .5; }
.chip { display: inline-flex; align-items: stretch; border: 1px solid var(--line); border-radius: 999px; background: var(--surface); overflow: hidden; }
.chip button { border: 0; background: none; cursor: pointer; padding: 7px 14px; font-size: .88rem; font-weight: 500; }
.chip button .count { color: var(--muted); font-family: var(--font-num); font-size: .78rem; margin-left: 4px; }
.chip.active { background: var(--green); border-color: var(--green); color: var(--surface); }
.chip.active .count { color: color-mix(in srgb, var(--surface) 75%, transparent); }

.btn { border: 1px solid transparent; border-radius: 8px; padding: 8px 14px; font-weight: 600; font-size: .9rem; cursor: pointer; }
.btn-danger { background: var(--danger); color: var(--surface); }
.btn-ghost { background: transparent; border-color: var(--line); }
.btn-primary { background: var(--green); color: var(--surface); padding: 12px 20px; font-size: 1rem; }
.btn-primary:hover { filter: brightness(1.08); }

/* Ledger */
.ledger { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); overflow: hidden; }
.row { display: grid; grid-template-columns: minmax(0, 2fr) minmax(0, 1.1fr) 72px 84px minmax(0, 1.5fr) minmax(0, 1.4fr) 76px 40px; gap: 14px; align-items: center; padding: 14px 18px; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.row.head { font-size: .72rem; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); font-weight: 600; padding-block: 10px; background: color-mix(in srgb, var(--green-soft) 50%, var(--surface)); }
.row .name { font-weight: 600; min-width: 0; display: grid; grid-template-columns: 52px minmax(0, 1fr); gap: 12px; align-items: center; }
.name-text { min-width: 0; }
.thumb { position: relative; width: 52px; height: 52px; border-radius: 8px; overflow: hidden; display: grid; place-items: center; background: var(--green-soft); color: var(--green); font-family: var(--font-display); font-size: 1.35rem; font-weight: 400; }
.thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .3s ease; }
.thumb.has-photo img { opacity: 1; }
.credit { display: block; font-size: .68rem; font-weight: 400; color: var(--muted); line-height: 1.3; }
.credit:empty { display: none; }
.credit a { color: inherit; }
.row.divider { display: block; padding-block: 18px 12px; background: color-mix(in srgb, var(--green-soft) 35%, var(--surface)); border-top: 2px solid var(--line); }
.row.divider strong { font-family: var(--font-display); font-weight: 400; font-size: 1.15rem; }
.row.divider .note { margin-top: 4px; max-width: 70ch; }
.row.former { background: color-mix(in srgb, var(--bg) 55%, var(--surface)); }
.row.former .name, .row.former .cat, .row.former .stars-cell, .row.former .rating-cell, .row.former .dinner, .row.former .wine { opacity: .5; filter: grayscale(1); }
.row.former .tag { cursor: default; }
.status-pill { display: inline-block; margin-right: 6px; padding: 2px 8px; border-radius: 999px; font-size: .7rem; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; background: var(--line); color: var(--ink); }
.chg { display: block; margin-top: 3px; font-size: .68rem; font-weight: 700; letter-spacing: .02em; line-height: 1.25; cursor: help; }
.chg-up { color: var(--green); }
.chg-down { color: var(--danger); }
.status-pill.status-closed { background: var(--danger-soft); color: var(--danger); }
.row .area { display: block; font-weight: 400; font-size: .85rem; color: var(--muted); }
.map { display: inline-grid; place-items: center; width: 26px; height: 26px; margin-left: 4px; vertical-align: -6px; border-radius: 6px; color: var(--green); }
.map:hover { background: var(--green-soft); }
.map svg { width: 16px; height: 16px; }
.note { display: block; font-family: var(--font-body); font-size: .78rem; line-height: 1.35; color: var(--muted); }
.notes .src { display: block; font-size: .75rem; color: var(--green); text-underline-offset: 2px; margin-top: 2px; }
.notes { min-width: 0; font-size: .88rem; color: var(--muted); line-height: 1.4; }
.rating { display: inline-flex; align-items: center; gap: 5px; }
.rating svg { width: 13px; height: 13px; color: var(--green); }
.wine { text-align: right; }
.dprice { text-align: right; }
.tag { display: inline-block; font-size: .8rem; padding: 3px 10px; border-radius: 999px; background: var(--green-soft); color: var(--green); font-weight: 500; cursor: pointer; border: 0; text-align: left; max-width: 100%; }
.row .cat { min-width: 0; }
.stars { display: inline-flex; gap: 2px; color: var(--gold); }
.stars svg { width: 15px; height: 15px; }
.price { text-align: right; }
.price.muted { color: var(--muted); }
.dinner { display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.bar { height: 6px; border-radius: 3px; background: var(--green-soft); overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--green); border-radius: 3px; transition: width .3s ease; }
.wish { width: 36px; height: 36px; border: 1px solid transparent; background: none; border-radius: 8px; color: var(--muted); cursor: pointer; display: grid; place-items: center; }
.wish:hover { color: var(--heart); background: color-mix(in srgb, var(--heart) 12%, transparent); }
.wish svg { width: 19px; height: 19px; fill: none; stroke: currentColor; }
.wish[aria-pressed="true"] { color: var(--heart); }
.wish[aria-pressed="true"] svg { fill: currentColor; }
.seg .wish-icon svg { width: 14px; height: 14px; fill: var(--heart); stroke: var(--heart); display: block; }
.sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* Map */
.map-canvas { width: 100%; height: 540px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); overflow: hidden; display: grid; place-items: center; }
.map-wait { color: var(--muted); font-size: .9rem; }
.map-foot { display: flex; justify-content: space-between; align-items: center; gap: 12px 24px; flex-wrap: wrap; margin-top: 14px; }
.map-status { font-size: .85rem; color: var(--muted); }
.map-legend .pin-num { display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; color: #fff; font-size: .75rem; font-weight: 700; background: var(--pin); }
.map-legend { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 10px 24px; font-size: .92rem; }
.map-legend li { display: inline-flex; align-items: center; gap: 8px; }
.map-legend svg { width: 22px; height: 22px; color: var(--pin); }
.map-legend .colour { font-weight: 600; }
.map-legend .count { font-family: var(--font-num); font-size: .8rem; color: var(--muted); }
.btn-primary { text-decoration: none; display: inline-flex; align-items: center; gap: 8px; }
.mlabel { display: none; }
.empty { padding: 40px 18px; text-align: center; color: var(--muted); }
.ledger-foot { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-top: 12px; font-size: .85rem; color: var(--muted); }
.linkish { background: none; border: 0; padding: 0; color: var(--green); font-weight: 600; cursor: pointer; text-decoration: underline; text-underline-offset: 3px; }

/* Stars breakdown */
.tiers { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; }
.tier { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 22px; display: grid; gap: 14px; }
.tier .top { display: flex; justify-content: space-between; align-items: center; }
.tier .stars svg { width: 20px; height: 20px; }
.tier h3 { font-size: 1.2rem; }
.tier .avg { font-family: var(--font-num); font-size: 2rem; line-height: 1; }
.tier .avg small { font-family: var(--font-body); font-size: .85rem; color: var(--muted); margin-left: 6px; }
.tier dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; margin: 0; font-size: .9rem; }
.tier dt { color: var(--muted); }
.tier dd { margin: 0; text-align: right; font-family: var(--font-num); font-variant-numeric: tabular-nums; }
.tier .bar { height: 8px; }

/* Method */
.method { display: grid; grid-template-columns: repeat(3, 1fr); gap: 32px; }
.method div { display: grid; gap: 8px; align-content: start; }
.method h3 { font-size: 1.15rem; }
.method p { color: var(--muted); font-size: .95rem; }

/* Contact */
.contact { display: grid; grid-template-columns: 1fr 1.4fr; gap: 48px; align-items: start; }
.contact .intro p { color: var(--muted); margin-top: 12px; max-width: 42ch; }
form { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 24px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field.full { grid-column: 1 / -1; }
.field label { font-size: .85rem; font-weight: 600; }
.field input, .field select, .field textarea { width: 100%; padding: 11px 13px; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); }
.field textarea { min-height: 120px; resize: vertical; }
.field input:focus, .field select:focus, .field textarea:focus { outline: none; border-color: var(--green); box-shadow: 0 0 0 3px var(--green-soft); }
.field .err { font-size: .8rem; color: var(--danger); min-height: 1em; }
.form-foot { grid-column: 1 / -1; display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.form-status { font-size: .9rem; color: var(--green); font-weight: 500; }

footer { background: var(--band); color: var(--band-muted); font-size: .85rem; padding-block: 24px; }
footer .wrap { display: flex; justify-content: space-between; gap: 12px; flex-wrap: wrap; }

.toast { position: fixed; left: 50%; bottom: calc(20px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 10px 12px 10px 16px; border-radius: 10px; display: flex; gap: 14px; align-items: center; font-size: .9rem; z-index: 20; max-width: calc(100% - 32px); box-shadow: 0 8px 24px rgba(0,0,0,.2); }
.toast button { background: none; border: 0; color: var(--gold); font-weight: 700; cursor: pointer; padding: 4px 6px; }

/* Responsive */
@media (max-width: 900px) {
  .hero .wrap, .contact { grid-template-columns: 1fr; gap: 28px; }
  .tiers, .method { grid-template-columns: 1fr; }
}
@media (max-width: 900px) {
  .row.head { display: none; }
  .row { grid-template-columns: minmax(0, 1fr) auto; grid-template-areas: "name wish" "cat stars" "notes notes" "dinner dinner" "rating wine"; gap: 8px 12px; padding: 16px; }
  .row .name { grid-area: name; }
  .row .cat { grid-area: cat; }
  .row .stars-cell { grid-area: stars; justify-self: end; }
  .row .notes { grid-area: notes; }
  .row .dinner { grid-area: dinner; grid-template-columns: auto 1fr auto; }
  .row .rating-cell { grid-area: rating; }
  .row .wine { grid-area: wine; }
  .row .wish-cell { grid-area: wish; justify-self: end; }
  .map-canvas { height: 440px; }
  .row .wine { justify-self: end; white-space: nowrap; }
  .row .rating-cell { white-space: nowrap; }
  .row .rating-cell .note { display: inline; margin-left: 6px; }
  .row .tag { white-space: normal; text-align: left; }
  .mlabel { display: inline; font-family: var(--font-body); font-size: .8rem; color: var(--muted); margin-right: 6px; }
}
@media (max-width: 720px) {
  .wrap { padding-inline: 16px; }
  .nav { display: none; }
  .toolbar { grid-template-columns: 1fr; }
  .filter-group { grid-template-columns: 1fr; }
  .flabel { padding-top: 0; }
  .figures { grid-template-columns: 1fr 1fr; }
  .figure:first-child { grid-column: 1 / -1; }
  form { grid-template-columns: 1fr; padding: 18px; }
}

/* City, currency and language switches */
.switchbar { border-top: 1px solid color-mix(in srgb, var(--band-ink) 12%, transparent); }
.switchbar .wrap { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding-block: 8px; flex-wrap: wrap; }
.hseg-right { display: flex; gap: 8px; flex-wrap: wrap; }
.hseg { display: inline-flex; border: 1px solid color-mix(in srgb, var(--band-ink) 25%, transparent); border-radius: 999px; overflow: hidden; }
.hseg a, .hseg button { border: 0; background: none; color: var(--band-muted); font-size: .82rem; font-weight: 600; padding: 5px 12px; text-decoration: none; cursor: pointer; line-height: 1.4; }
.hseg > * + * { border-left: 1px solid color-mix(in srgb, var(--band-ink) 25%, transparent); }
.hseg a:hover, .hseg button:hover { color: var(--band-ink); }
.hseg [aria-current="page"], .hseg [aria-pressed="true"] { background: var(--band-ink); color: var(--band); }
.alt-name { display: block; font-weight: 500; font-size: .82rem; color: var(--ink); opacity: .75; }
.notice { display: inline-block; margin: 0 6px 4px 0; padding: 1px 7px; border-radius: 999px; font-size: .7rem; font-weight: 700; background: color-mix(in srgb, var(--gold) 22%, transparent); color: var(--ink); }
.rate-line { margin: -4px 0 14px; font-size: .82rem; color: var(--muted); }
:lang(zh-Hant-TW) .eyebrow, :lang(zh-Hant-TW) .flabel, :lang(zh-Hant-TW) .figure .label, :lang(zh-Hant-TW) .row.head { letter-spacing: .04em; }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="rosette" viewBox="0 0 24 24">
    <g fill="currentColor">
      <ellipse cx="12" cy="12" rx="3.6" ry="10.5"/>
      <ellipse cx="12" cy="12" rx="3.6" ry="10.5" transform="rotate(60 12 12)"/>
      <ellipse cx="12" cy="12" rx="3.6" ry="10.5" transform="rotate(120 12 12)"/>
    </g>
  </symbol>
  <symbol id="pin" viewBox="0 0 24 24">
    <path fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" d="M12 21s-7-6.2-7-11.5a7 7 0 0 1 14 0C19 14.8 12 21 12 21z"/>
    <circle cx="12" cy="9.5" r="2.5" fill="none" stroke="currentColor" stroke-width="2"/>

const params = new URLSearchParams(location.search);

      html += '<div class="row former" role="row">' + nameCell(r) +
        '<span class="cat" role="cell"><span class="tag">' + esc(catOf(r.cat, r)) + "</span></span>" +
        '<span class="stars-cell" role="cell">' + rosettes(r.formerStars) + '<span class="note">' + t("formerly") + "</span></span>" +
        '<span class="rating-cell" role="cell"><span class="num muted">–</span></span>' +
        '<span class="notes" role="cell"><span class="status-pill status-' + esc(r.status) + '">' + (r.change === "down" ? "▼ " : "") + (label[r.status] || label.changed) + "</span>" + esc(statusNoteOf(r)) + "</span>" +
        '<span class="dinner" role="cell"><span class="dprice"><span class="num muted">–</span></span></span>' +
        '<span class="wine num muted" role="cell">–</span><span class="wish-cell" role="cell"></span></div>';
    });
  }
  $("ledger").innerHTML = html;
  observeThumbs();
  updateMap(true);
  $("showing").textContent = t("showing", { a: rows.length, b: RESTAURANTS.length }) + (former.length ? t("showingFormer", { c: former.length }) : "");
}

// ---------- Headline figures and star tiers ----------
function renderFigures() {
  const all = RESTAURANTS;
  $("fCount").textContent = all.length;
  const n = [0, 1, 2, 3].map((s) => all.filter((r) => r.stars === s).length);
  $("fCountSub").textContent = t("starCounts").replace("{3}", n[3]).replace("{2}", n[2]).replace("{1}", n[1]);
  const byPrice = all.filter(isMenu).sort((a, b) => a.dinner - b.dinner);
  if (!byPrice.length) return;
  const lo = byPrice[0], hi = byPrice[byPrice.length - 1];
  $("fMin").textContent = money(lo.dinner); $("fMinSub").textContent = nameOf(lo);
  $("fMax").textContent = money(hi.dinner); $("fMaxSub").textContent = nameOf(hi);
}
function renderTiers() {
  const tiers = [1, 2, 3].map((s) => {
    const list = RESTAURANTS.filter((r) => r.stars === s);
    const prices = list.filter(isMenu).map((r) => r.dinner);
    const avg = prices.length ? Math.round(prices.reduce((a, b) => a + b, 0) / prices.length) : 0;
    const rated = list.filter((r) => r.rating);
    return { s, n: list.length, priced: prices.length, avg, min: Math.min(...prices), max: Math.max(...prices), rating: rated.length ? rated.reduce((a, r) => a + r.rating, 0) / rated.length : null };
  });
  const top = Math.max(...tiers.map((x) => x.avg), 1);
  const names = t("tierNames");
  $("tiers").innerHTML = tiers.map((x, i) => {
    const prev = i > 0 && tiers[i - 1].priced && x.priced ? x.avg - tiers[i - 1].avg : null;
    return '<div class="tier"><div class="top"><h3>' + names[x.s - 1] + "</h3>" + rosettes(x.s) + "</div>" +
      (x.priced
        ? '<div class="avg">' + money(x.avg) + "<small>" + t("avgDinner") + "</small></div>" +
          '<div class="bar"><span style="width:' + (x.avg / top * 100).toFixed(1) + '%"></span></div>' +
          "<dl><dt>" + t("tRestaurants") + "</dt><dd>" + x.n + "</dd><dt>" + t("tRange") + "</dt><dd>" + money(x.min) + "–" + money(x.max) + "</dd><dt>" + t("tRating") + "</dt><dd>" + (x.rating ? x.rating.toFixed(1) : "–") + "</dd>" +
          (prev !== null ? "<dt>" + t("tVs", { n: x.s - 1 }) + "</dt><dd>" + (prev >= 0 ? "+" : "−") + money(Math.abs(prev)).replace("≈", "") + "</dd>" : "") + "</dl>"
        : '<p style="color: var(--muted)">' + (x.n ? t("tNoPrices") : t("tNone", { tier: names[x.s - 1] })) + "</p>") + "</div>";
  }).join("");
}

// ---------- Google: photos and map ----------
let mapsBoot = null;
function loadGoogle() {
  if (!mapsBoot) mapsBoot = new Promise((resolve, reject) => {
    window.__starredBillMaps = resolve;
    const s = document.createElement("script");
    s.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(GOOGLE_MAPS_API_KEY) + "&v=weekly&loading=async&language=" + (zh() ? "zh-TW" : "en-GB") + "&callback=__starredBillMaps";
    s.async = true;
    s.onerror = reject;
    document.head.appendChild(s);
  });
  return mapsBoot;
}
const loadPlaces = () => loadGoogle().then(() => google.maps.importLibrary("places"));
const photoCache = new Map();
function fetchPhoto(placeId) {
  if (!photoCache.has(placeId)) {
    photoCache.set(placeId, (async () => {
      const { Place } = await loadPlaces();
      const place = new Place({ id: placeId });
      await place.fetchFields({ fields: ["photos"] });
      const photo = place.photos && place.photos[0];
      if (!photo) return null;
      const author = (photo.authorAttributions || [])[0];
      return { uri: photo.getURI({ maxWidth: 200, maxHeight: 200 }), author: author ? author.displayName : "", authorUri: author ? author.uri : "" };
    })().catch(() => null));
  }
  return photoCache.get(placeId);
}
async function applyPhoto(el) {
  const info = await fetchPhoto(el.dataset.pid);
  if (!info || !el.isConnected || el.querySelector("img")) return;
  const img = new Image();
  img.alt = "";
  img.decoding = "async";
  img.src = info.uri;
  img.onload = () => el.classList.add("has-photo");
  el.appendChild(img);
  const credit = el.parentElement.querySelector(".credit");
  if (credit) credit.innerHTML = t("photo") + ": " + (info.author ? (info.authorUri ? '<a href="' + esc(info.authorUri) + '" target="_blank" rel="noopener">' + esc(info.author) + "</a>" : esc(info.author)) + " · " : "") + "Google Maps";
}
const thumbObserver = "IntersectionObserver" in window ? new IntersectionObserver((entries) => {
  entries.forEach((e) => { if (e.isIntersecting) { thumbObserver.unobserve(e.target); applyPhoto(e.target); } });
}, { rootMargin: "300px 0px" }) : null;
function observeThumbs() {
  if (!GOOGLE_MAPS_API_KEY || !thumbObserver) return;
  document.querySelectorAll(".thumb[data-pid]").forEach((el) => thumbObserver.observe(el));
}

const mapState = { map: null, info: null, markers: new Map() };
function pinIcon(stars) {
  const svg = "<svg xmlns='http://www.w3.org/2000/svg' width='30' height='40' viewBox='0 0 30 40'><path d='M15 38.5S2 26.6 2 15.5a13 13 0 0 1 26 0C28 26.6 15 38.5 15 38.5z' fill='" + MAP_PIN_COLOURS[stars] + "' stroke='#ffffff' stroke-width='2'/><text x='15' y='20.5' text-anchor='middle' font-family='Arial,sans-serif' font-size='13' font-weight='700' fill='#ffffff'>" + stars + "</text></svg>";
  return { url: "data:image/svg+xml;charset=UTF-8," + encodeURIComponent(svg), scaledSize: new google.maps.Size(30, 40), anchor: new google.maps.Point(15, 39) };
}
function infoHtml(r) {
  const price = r.dinner == null ? t("infoNoPrice") : money(r.dinner) + " " + (r.dinnerType === "main" ? t("perMain") : r.dinnerType === "spend" ? t("typicalSpend") : t("infoDinner"));
  return '<div style="font-family:Figtree,system-ui,sans-serif;color:#12261C;max-width:240px;line-height:1.4">' +
    '<div style="font-weight:700;font-size:15px">' + esc(nameOf(r)) + "</div>" +
    (altNameOf(r) ? '<div style="font-size:12px;color:#5A6E62">' + esc(altNameOf(r)) + "</div>" : "") +
    '<div style="color:#B3862B;font-size:13px">' + "✱".repeat(r.stars) + ' <span style="color:#5A6E62">' + esc(catOf(r.cat, r)) + " · " + esc(areaOf(r)) + "</span></div>" +
    '<div style="margin-top:6px;font-size:13px">' + esc(price) + (r.wine ? " · " + t("infoWine") + " " + money(r.wine) : "") + "</div>" +
    (r.rating ? '<div style="font-size:13px;color:#5A6E62">★ ' + r.rating.toFixed(1) + " " + t("infoGoogle") + "</div>" : "") +
    (r.change ? '<div style="font-size:12px;color:' + (r.change === "down" ? "#A33A2E" : "#1E6142") + '">' + esc(changeNoteOf(r) + ", " + monthYear(r.changeDate)) + "</div>" : "") +
    '<a href="' + mapsUrl(r) + '" target="_blank" rel="noopener" style="display:inline-block;margin-top:6px;color:#1E6142;font-weight:600;font-size:13px">' + t("infoOpen") + "</a></div>";
}
async function initMap() {
  try {
    await loadGoogle();
    const { Map, InfoWindow } = await google.maps.importLibrary("maps");
    const { Marker } = await google.maps.importLibrary("marker");
    $("mapCanvas").innerHTML = "";
    $("mapCanvas").style.display = "block";
    mapState.map = new Map($("mapCanvas"), { center: C.center, zoom: 11, mapTypeControl: false, streetViewControl: false, clickableIcons: false, gestureHandling: "cooperative" });
    mapState.info = new InfoWindow();
    RESTAURANTS.forEach((r) => {
      if (r.lat == null || r.lng == null) return;
      const m = new Marker({ position: { lat: r.lat, lng: r.lng }, title: nameOf(r), icon: pinIcon(r.stars), zIndex: r.stars * 10 });
      m.addListener("click", () => { mapState.info.setContent(infoHtml(r)); mapState.info.open({ anchor: m, map: mapState.map }); });
      mapState.markers.set(r.id, m);
    });
    updateMap(true);
  } catch (e) {
    $("mapCanvas").innerHTML = '<p class="map-wait">' + t("mapError") + "</p>";
  }
}
function updateMap(fit) {
  if (!mapState.map) return;
  const visible = new Set(filtered().map((r) => r.id));
  const bounds = new google.maps.LatLngBounds();
  let n = 0;
  mapState.markers.forEach((m, id) => {
    const on = visible.has(id);
    if ((m.getMap() != null) !== on) m.setMap(on ? mapState.map : null);
    if (on) { bounds.extend(m.getPosition()); n++; }
  });
  mapState.info.close();
  $("mapStatus").textContent = n ? t("mapShowing", { n }) : t("mapNone");
  if (fit && n > 1) mapState.map.fitBounds(bounds, 40);
  else if (fit && n === 1) { mapState.map.setCenter(bounds.getCenter()); mapState.map.setZoom(15); }
}
function renderLegend() {
  const colours = t("colours");
  $("mapLegend").innerHTML = [1, 2, 3].map((s) =>
    '<li><span class="pin-num" style="--pin:' + MAP_PIN_COLOURS[s] + '" aria-hidden="true">' + s + "</span><span>" + esc(t("legendItem", { c: colours[s - 1], n: s })) + '</span><span class="count">' + RESTAURANTS.filter((r) => r.stars === s).length + "</span></li>").join("");
}
function startMapWhenNear() {
  $("map").hidden = $("mapNav").hidden = !GOOGLE_MAPS_API_KEY;
  if (!GOOGLE_MAPS_API_KEY) return;
  let started = false;
  const start = () => { if (started) return; started = true; window.removeEventListener("scroll", check); initMap(); };
  const check = () => { if ($("map").getBoundingClientRect().top < window.innerHeight + 400) start(); };
  window.addEventListener("scroll", check, { passive: true });
  if (location.hash === "#map") start();
  check();
}

// ---------- Exchange rates ----------
async function loadRate() {
  try {
    const d = await fetch("https://open.er-api.com/v6/latest/" + C.currency).then((r) => r.json());
    if (d && d.rates && CURRENCY_ORDER.every((c) => d.rates[c])) {
      CURRENCY_ORDER.forEach((c) => { state.rates[c] = d.rates[c]; });
      state.rateDate = new Date(d.time_last_update_unix * 1000);
      renderAll();
    }
  } catch (e) { /* keep the fallback rate */ }
}

// ---------- Render and events ----------
function render() { renderShowFilter(); renderStarFilter(); renderChips(); renderLedger(); }
function renderAll() { applyStatic(); render(); renderFigures(); renderTiers(); renderLegend(); }

let toastTimer;
function toast(msg, undo) {
  state.lastUndo = undo;
  $("toastMsg").textContent = msg;
  $("undo").hidden = !undo;
  $("toast").hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { $("toast").hidden = true; state.lastUndo = null; }, 5000);
}
function toggleWish(id) {
  const r = RESTAURANTS.find((x) => x.id === id);
  if (onWishlist(r)) {
    state.wishlist = state.wishlist.filter((x) => x !== id);
    toast(t("toastRemoved", { name: nameOf(r) }), () => { state.wishlist.push(id); });
  } else {
    state.wishlist.push(id);
    toast(t("toastAdded", { name: nameOf(r) }), null);
  }
  save(); render();
}

document.addEventListener("click", (e) => {
  const el = e.target.closest("button, #wishLink");
  if (!el) return;
  if (el.id === "wishLink") {
    e.preventDefault();
    state.wishOnly = true; state.changesOnly = false; render();
    $("compare").scrollIntoView();
  } else if (el.dataset.lang) {
    LANG = el.dataset.lang;
    store.set("starred-bill-lang", LANG);
    const p = new URLSearchParams(location.search); p.set("lang", LANG); p.set("city", CITY);
    history.replaceState(null, "", "?" + p.toString() + location.hash);
    renderAll();
    if (mapState.map) { mapState.markers.forEach((m, id) => m.setTitle(nameOf(RESTAURANTS.find((r) => r.id === id)))); }
  } else if (el.dataset.currency) {
    state.currency = el.dataset.currency; save(); renderAll();
  } else if (el.dataset.wish) {
    toggleWish(Number(el.dataset.wish));
  } else if (el.dataset.show) {
    state.wishOnly = el.dataset.show === "wishlist"; state.changesOnly = el.dataset.show === "changes"; render();
  } else if (el.dataset.stars) {
    state.activeStars = Number(el.dataset.stars); render();
  } else if (el.id === "clearFilters") {
    state.activeStars = 0; state.activeCat = "All"; state.wishOnly = false; state.changesOnly = false; state.query = ""; $("q").value = ""; render();
  } else if (el.dataset.cat) {
    state.activeCat = el.dataset.cat; render();
    if (el.classList.contains("tag")) $("compare").scrollIntoView();
  } else if (el.id === "undo") {
    if (state.lastUndo) { state.lastUndo(); state.lastUndo = null; save(); render(); }
    $("toast").hidden = true;
  }
});
$("q").addEventListener("input", (e) => { state.query = e.target.value; renderLedger(); });
$("sort").addEventListener("change", (e) => { state.sort = e.target.value; save(); renderLedger(); });
$("contactForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = $("cName").value.trim(), email = $("cEmail").value.trim(), msg = $("cMsg").value.trim();
  $("cNameErr").textContent = name ? "" : t("errName");
  $("cEmailErr").textContent = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email) ? "" : t("errEmail");
  $("cMsgErr").textContent = msg ? "" : t("errMsg");
  if (!name || $("cEmailErr").textContent || !msg) { $("formStatus").textContent = ""; return; }
  $("formStatus").textContent = t("sent", { name });
  e.target.reset();
});

// ---------- Start: load the chosen city's data ----------
(function start() {
  const s = document.createElement("script");
  s.src = C.file;
  s.onload = () => {
    ALL_RESTAURANTS = window.RESTAURANTS || [];
    RESTAURANTS = ALL_RESTAURANTS.filter((r) => !r.status);
    FORMER = ALL_RESTAURANTS.filter((r) => r.status);
    load();
    $("sort").value = state.sort;
    renderAll();
    startMapWhenNear();
    loadRate();
  };
  document.body.appendChild(s);
})();
</script>
