<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<link rel="canonical" href="{{canonical}}">
<meta property="og:title" content="{{title}}">
<meta property="og:description" content="{{description}}">
<meta property="og:url" content="{{canonical}}">
<meta property="og:type" content="website">
<meta name="robots" content="noindex">
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#10362A">
<link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="Starred Bill">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gloock&family=Figtree:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&family=Noto+Serif+TC:wght@500&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Serif+JP:wght@500&display=swap">
<link rel="stylesheet" href="{{asset:site.css}}">
<!-- Visit statistics: Umami, no cookies (see the privacy page) -->
<script defer src="https://cloud.umami.is/script.js" data-website-id="0717d470-551a-4b38-8632-c2e273c3cc5d" data-domains="starredbill.com,www.starredbill.com"></script>
</head>
<body class="account-page">
{{icons}}
<header class="site-header">
  <div class="wrap">
    <a class="brand" href="/" id="brandLink"><svg><use href="#star"/></svg>The Starred Bill</a>
    <div class="header-actions">
      <nav class="nav" aria-label="Sections">
        <a href="/#destinations" id="destLink" data-i18n="navDestinations">Destinations</a>
      </nav>
      <button type="button" class="account-btn" id="accountBtn"></button>
      <button type="button" class="share-btn" id="shareBtn" aria-haspopup="true" aria-expanded="false" aria-controls="sharePanel"></button>
      <a href="/#wishlist" class="wish-link" id="wishLink"><svg aria-hidden="true"><use href="#heart"/></svg><span data-i18n="wishlist">Wishlist</span> <span id="wishCount">0</span></a>
      <div class="share-panel" id="sharePanel" hidden></div>
    </div>
  </div>
  <div class="switchbar">
    <div class="wrap">
      <nav class="crumbs" id="crumbs" aria-label="Where you are"></nav>
      <div class="hseg-right">
        <button type="button" class="install-btn" id="installBtn" hidden></button>
        <div class="hseg" role="group" aria-label="Language / 語言" id="langSwitch"></div>
      </div>
    </div>
  </div>
</header>

<main class="wrap acct-main" id="acctMain">
  <h1 class="acct-h1" data-i18n="accTitle">Your account</h1>
  <p class="acct-lede" id="acctLede"></p>
  <div id="acctBody"><p class="acct-loading" data-i18n="accLoading"></p></div>
</main>

<footer>
  <div class="wrap">
    <span>The Starred Bill</span>
    <span data-i18n="footNote"></span>
  </div>
</footer>

<script id="page-data" type="application/json">{{data}}</script>
<script src="{{asset:common.js}}"></script>
<script src="{{asset:account.js}}"></script>
<script src="{{asset:account-page.js}}"></script>
</body>
</html>
