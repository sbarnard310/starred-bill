# Exchange rates: on the 1st of each month, refreshes content/currencies.json from ExchangeRate-API's free open endpoint
# (scripts/exchange_rates.py: every currency's perUSD and the rates' date, rateDate, which pages show beside converted
# prices) and commits it to main only when something changed; Cloudflare then publishes it. Monthly rather than daily
# because every converted price on the site changes with the rates, so each refresh rebuilds and resubmits every page
# (IndexNow). Run it by hand from the Actions tab when rates move sharply. Needs no secrets.
name: Exchange rates

on:
  schedule:
    - cron: "30 5 1 * *"   # 05:30 UTC on the 1st of each month
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: exchange-rates
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Fetch the latest rates
        run: python3 scripts/exchange_rates.py --write
      - name: Commit them if they changed
        run: |
          if git diff --quiet -- content/currencies.json; then
            echo "Nothing changed."; exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/currencies.json
          git commit -m "Update exchange rates"
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push -q origin HEAD:main && exit 0
            sleep 10
          done
          echo "Couldn't push the exchange rates after three tries."; exit 1
