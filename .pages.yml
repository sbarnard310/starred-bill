# Pages CMS (https://app.pagescms.org) reads this file to build the editing forms for starredbill.com.
# Each field matches a key in the JSON files under content/; README.md explains them in more detail.
# Saving in Pages CMS commits to GitHub, which rebuilds and publishes the site within a couple of minutes.

settings:
  content:
    merge: true   # keep any keys in a file that aren't listed below

content:
  - name: restaurants
    label: Restaurants
    description: One entry per restaurant, in a folder per country. Saving publishes the change within a couple of minutes.
    type: collection
    path: content/restaurants
    format: json
    subfolders: true
    filename: "{primary}.json"
    operations:
      rename: false   # the file name is the restaurant's id, used by visitors' wishlists
    view:
      primary: name
      fields: [name, stars, city, dinner, lunch]
      search: [name, nameZh, cuisine, area]
      sort: [name, stars, dinner]
      default:
        sort: name
        order: asc
    fields:
      - name: name
        label: Name
        type: string
        required: true
      - name: nameZh
        label: Name in Chinese
        type: string
      - name: nameJa
        label: Name in Japanese
        description: For restaurants in Japan, e.g. 明寂.
        type: string
      - name: nameKo
        label: Name in Korean
        description: For restaurants in South Korea, e.g. 밍글스.
        type: string
      - name: city
        label: City
        description: The city it's in. It then also appears on that city's region and country pages, and any collection that includes them.
        type: reference
        required: true
        options:
          collection: places
          value: "{fields.id}"
          label: "{fields.name} ({fields.type})"
          search: "name,nameZh"
      - name: area
        label: Area
        description: Neighbourhood, e.g. Mayfair or Zhongshan, Taipei.
        type: string
      - name: areaZh
        label: Area in Chinese
        type: string
      - name: areaFr
        label: Area in French
        description: Only for places offered in French, e.g. 8e arrondissement.
        type: string
      - name: areaEs
        label: Area in Spanish
        description: Only for places offered in Spanish.
        type: string
      - name: areaIt
        label: Area in Italian
        description: Only for places offered in Italian.
        type: string
      - name: areaKo
        label: Area in Korean
        description: Only for places offered in Korean.
        type: string
      - name: areaJa
        label: Area in Japanese
        description: Only for places offered in Japanese, e.g. 港区西麻布.
        type: string
      - name: address
        label: Address
        description: Full address, also used for the Google Maps link.
        type: string
      - name: addressZh
        label: Address in Chinese
        type: string
      - name: addressJa
        label: Address in Japanese
        type: string
      - name: stars
        label: Michelin stars
        description: 1, 2 or 3. Use 0 for a restaurant that has lost its stars or closed, and fill in Status below.
        type: number
        required: true
        options: { min: 0, max: 3, step: 1 }
      - name: cuisine
        label: Cuisine
        description: Michelin's cuisine label, e.g. Modern British. A new label adds a new filter button.
        type: string
      - name: cuisineZh
        label: Cuisine in Chinese
        type: string
      - name: cuisineJa
        label: Cuisine in Japanese
        description: Michelin's Japanese label, e.g. 日本料理.
        type: string
      - name: change
        label: Recent star change
        description: Shows a ▲ or ▼ badge. Leave empty if nothing changed in the last two guides.
        type: select
        options:
          values:
            - { value: new, label: "▲ Gained its first star" }
            - { value: up, label: "▲ Gained a star" }
            - { value: down, label: "▼ Lost a star" }
      - name: changeNote
        label: Star change note
        description: e.g. Gained its first star
        type: string
      - name: changeNoteZh
        label: Star change note in Chinese
        type: string
      - name: changeNoteFr
        label: Star change note in French
        type: string
      - name: changeNoteEs
        label: Star change note in Spanish
        type: string
      - name: changeNoteIt
        label: Star change note in Italian
        type: string
      - name: changeNoteKo
        label: Star change note in Korean
        type: string
      - name: changeNoteJa
        label: Star change note in Japanese
        type: string
      - name: changeDate
        label: Star change date
        description: Year and month of the Michelin Guide announcement, e.g. 2026-02.
        type: string
        pattern: { regex: '^(\d{4}-\d{2})?$', message: "Use year-month, e.g. 2026-02" }
      - name: rating
        label: Google rating
        description: Out of 5, e.g. 4.6.
        type: number
        options: { min: 0, max: 5, step: any }
      - name: reviews
        label: Number of Google reviews
        type: number
        options: { min: 0, step: 1 }
      - name: ratingNote
        label: Google rating note
        type: string
      - name: dinner
        label: Dinner price
        description: Per person, in the country's currency, numbers only (195, not £195). Leave empty if not confirmed.
        type: number
        options: { min: 0, step: any }
      - name: dinnerType
        label: Dinner price is
        type: select
        options:
          values:
            - { value: menu, label: "A tasting or set menu" }
            - { value: main, label: "A typical main course (à la carte)" }
            - { value: spend, label: "Typical spend per person (sharing plates)" }
      - name: dinnerNote
        label: Dinner note
        description: What the price covers, e.g. Tasting menu, 8 courses.
        type: string
      - name: dinnerNoteZh
        label: Dinner note in Chinese
        type: string
      - name: dinnerNoteFr
        label: Dinner note in French
        type: string
      - name: dinnerNoteEs
        label: Dinner note in Spanish
        type: string
      - name: dinnerNoteIt
        label: Dinner note in Italian
        type: string
      - name: dinnerNoteKo
        label: Dinner note in Korean
        type: string
      - name: dinnerNoteJa
        label: Dinner note in Japanese
        type: string
      - name: wine
        label: Wine pairing price (dinner)
        description: Cheapest pairing, numbers only. Leave empty if there isn't one or it's not confirmed.
        type: number
        options: { min: 0, step: any }
      - name: sourceType
        label: Dinner price source
        type: select
        options:
          values:
            - { value: site, label: "Restaurant's own website" }
            - { value: press, label: "Review or booking site" }
            - { value: none, label: "No link" }
      - name: source
        label: Dinner price link
        description: Where the dinner price came from.
        type: string
      - name: noLunch
        label: No lunch service
        description: Tick if the restaurant doesn't serve lunch. It then shows at the bottom of the Lunch view.
        type: boolean
      - name: lunch
        label: Lunch price
        description: Per person, numbers only. Leave empty if lunch is served but the price isn't known.
        type: number
        options: { min: 0, step: any }
      - name: lunchType
        label: Lunch price is
        type: select
        options:
          values:
            - { value: menu, label: "A tasting or set menu" }
            - { value: main, label: "A typical main course (à la carte)" }
            - { value: spend, label: "Typical spend per person (sharing plates)" }
      - name: lunchNote
        label: Lunch note
        description: What the price covers and which days it's served, e.g. Set lunch, 3 courses, Wed–Sat.
        type: string
      - name: lunchNoteZh
        label: Lunch note in Chinese
        type: string
      - name: lunchNoteFr
        label: Lunch note in French
        type: string
      - name: lunchNoteEs
        label: Lunch note in Spanish
        type: string
      - name: lunchNoteIt
        label: Lunch note in Italian
        type: string
      - name: lunchNoteKo
        label: Lunch note in Korean
        type: string
      - name: lunchNoteJa
        label: Lunch note in Japanese
        type: string
      - name: lunchWine
        label: Wine pairing price (lunch)
        type: number
        options: { min: 0, step: any }
      - name: lunchSourceType
        label: Lunch price source
        type: select
        options:
          values:
            - { value: site, label: "Restaurant's own website" }
            - { value: press, label: "Review or booking site" }
            - { value: none, label: "No link" }
      - name: lunchSource
        label: Lunch price link
        type: string
      - name: notice
        label: Notice
        description: A current notice, e.g. Temporarily closed. Shows as a badge.
        type: string
      - name: noticeZh
        label: Notice in Chinese
        type: string
      - name: noticeJa
        label: Notice in Japanese
        type: string
      - name: status
        label: Status (only if no longer starred)
        description: Leave empty for starred restaurants. Set this to move it to the greyed-out "No longer starred" list.
        type: select
        options:
          values:
            - { value: lost, label: "Lost its stars" }
            - { value: closed, label: "Closed" }
            - { value: changed, label: "Changed (e.g. rebranded or moved)" }
      - name: formerStars
        label: Stars it used to have
        type: number
        options: { min: 1, max: 3, step: 1 }
      - name: statusNote
        label: Status note
        description: What happened, e.g. Lost its star in the 2026 guide.
        type: string
      - name: statusNoteZh
        label: Status note in Chinese
        type: string
      - name: statusNoteFr
        label: Status note in French
        type: string
      - name: statusNoteEs
        label: Status note in Spanish
        type: string
      - name: statusNoteIt
        label: Status note in Italian
        type: string
      - name: statusNoteKo
        label: Status note in Korean
        type: string
      - name: statusNoteJa
        label: Status note in Japanese
        type: string
      - name: website
        label: Website
        type: string
      - name: lat
        label: Map latitude
        description: From the Michelin Guide or Google Maps, e.g. 51.5136.
        type: number
        options: { step: any }
      - name: lng
        label: Map longitude
        description: e.g. -0.1417.
        type: number
        options: { step: any }
      - name: placeId
        label: Google place ID
        description: Used to load the restaurant's photo from Google.
        type: string

  - name: places
    label: Places
    description: Countries, regions, cities and collections. Every one gets a page; one with no starred restaurants yet says so.
    type: collection
    path: content/places
    format: json
    filename: "{fields.id}.json"
    operations:
      rename: false
    view:
      primary: name
      fields: [name, type, parent]
      search: [name, nameZh, id]
      sort: [name, type]
      default:
        sort: name
        order: asc
    fields:
      - name: id
        label: ID
        description: Lower-case letters, numbers and hyphens, e.g. new-york. Used in the web address, so don't change it once published.
        type: string
        required: true
        pattern: { regex: '^[a-z0-9]+(-[a-z0-9]+)*$', message: "Use lower-case letters, numbers and hyphens, e.g. new-york" }
      - name: type
        label: Type
        type: select
        required: true
        options:
          values:
            - { value: country, label: "Country" }
            - { value: region, label: "Region (e.g. England, Yorkshire)" }
            - { value: city, label: "City" }
            - { value: district, label: "District inside a city (e.g. Manhattan, Brooklyn)" }
            - { value: group, label: "Collection (overlapping area, e.g. Basque Country)" }
      - name: name
        label: Name
        type: string
        required: true
      - name: nameZh
        label: Name in Chinese
        type: string
      - name: nameYue
        label: Name in Cantonese
        description: Only if it differs from the Chinese name.
        type: string
      - name: nameFr
        label: Name in French
        type: string
      - name: nameEs
        label: Name in Spanish
        type: string
      - name: nameIt
        label: Name in Italian
        type: string
      - name: nameKo
        label: Name in Korean
        type: string
      - name: nameJa
        label: Name in Japanese
        type: string
      - name: languages
        label: Languages offered
        description: The language buttons on this page and the pages inside it. Leave empty for English only. Otherwise English plus the main official language: Chinese (and Cantonese) for Taiwan, Hong Kong and Macau, French for France and Monaco, Japanese for Japan, Spanish for Spain, Italian for Italy, Korean for South Korea.
        type: select
        options:
          multiple: true
          values:
            - { value: en, label: "English" }
            - { value: zh, label: "中文 (Chinese)" }
            - { value: yue, label: "廣東話 (Cantonese)" }
            - { value: fr, label: "Français (French)" }
            - { value: ja, label: "日本語 (Japanese)" }
            - { value: es, label: "Español (Spanish)" }
            - { value: it, label: "Italiano (Italian)" }
            - { value: ko, label: "한국어 (Korean)" }
      - name: parent
        label: Inside (regions, cities and districts)
        description: The country or region this region or city sits in, e.g. London is inside England, and England inside the United Kingdom. A district sits inside a city, e.g. Manhattan inside New York.
        type: reference
        options:
          collection: places
          value: "{fields.id}"
          label: "{fields.name} ({fields.type})"
          search: "name,nameZh"
      - name: includes
        label: Includes (collections only)
        description: The countries, regions or cities this collection covers. They can be in different countries.
        type: reference
        options:
          collection: places
          value: "{fields.id}"
          label: "{fields.name} ({fields.type})"
          search: "name,nameZh"
          multiple: true
      - name: currency
        label: Currency (countries only)
        description: Three-letter code, e.g. GBP, EUR, JPY. It must also be listed under Currencies.
        type: string
        pattern: { regex: '^([A-Z]{3})?$', message: "Use a three-letter code in capitals, e.g. EUR" }
      - name: redirectFrom
        label: Old web addresses
        description: Earlier addresses of this page, e.g. /uk/london/. Visitors and old links there are sent on to the page's current address.
        type: string
        list: true
      - name: inSentence
        label: Name mid-sentence
        description: Only if it reads differently in a sentence, e.g. "the UK" for United Kingdom.
        type: string
      - name: inSentenceFr
        label: Name mid-sentence in French
        description: With its preposition, e.g. "à Paris" or "en France".
        type: string
      - name: inSentenceEs
        label: Name mid-sentence in Spanish
        description: With its preposition, e.g. "en Madrid" or "en el País Vasco".
        type: string
      - name: inSentenceIt
        label: Name mid-sentence in Italian
        description: With its preposition, e.g. "nel Lazio". Leave empty for "a" + a city or "in" + a country or region.
        type: string
      - name: inSentenceKo
        label: Name mid-sentence in Korean
        description: With its preposition, e.g. "nel Lazio". Leave empty for "a" + a city or "in" + a country or region.
        type: string
      - name: intro
        label: Introduction
        description: Extra sentence under the page title, e.g. which currency prices are in. Regions and cities use their country's unless they have their own.
        type: text
      - name: introZh
        label: Introduction in Chinese
        type: text
      - name: introYue
        label: "Introduction (Cantonese)"
        type: text
      - name: introFr
        label: "Introduction (French)"
        type: text
      - name: introEs
        label: "Introduction (Spanish)"
        type: text
      - name: introIt
        label: "Introduction (Italian)"
        type: text
      - name: introKo
        label: "Introduction (Korean)"
        type: text
      - name: introJa
        label: "Introduction (Japanese)"
        type: text
      - name: serviceText
        label: "Method: per person, before service"
        description: Explains service charges in this country.
        type: text
      - name: serviceTextZh
        label: "Method: per person, before service (Chinese)"
        type: text
      - name: serviceTextYue
        label: "Method: per person, before service (Cantonese)"
        type: text
      - name: serviceTextFr
        label: "Method: per person, before service (French)"
        type: text
      - name: serviceTextEs
        label: "Method: per person, before service (Spanish)"
        type: text
      - name: serviceTextIt
        label: "Method: per person, before service (Italian)"
        type: text
      - name: serviceTextKo
        label: "Method: per person, before service (Korean)"
        type: text
      - name: serviceTextJa
        label: "Method: per person, before service (Japanese)"
        type: text
      - name: sourcesText
        label: "Method: where prices come from"
        type: text
      - name: sourcesTextZh
        label: "Method: where prices come from (Chinese)"
        type: text
      - name: sourcesTextYue
        label: "Method: where prices come from (Cantonese)"
        type: text
      - name: sourcesTextFr
        label: "Method: where prices come from (French)"
        type: text
      - name: sourcesTextEs
        label: "Method: where prices come from (Spanish)"
        type: text
      - name: sourcesTextIt
        label: "Method: where prices come from (Italian)"
        type: text
      - name: sourcesTextKo
        label: "Method: where prices come from (Korean)"
        type: text
      - name: sourcesTextJa
        label: "Method: where prices come from (Japanese)"
        type: text
      - name: starsText
        label: "Method: stars and Google rating"
        description: Which Michelin Guide edition the stars come from, and when it was announced.
        type: text
      - name: starsTextZh
        label: "Method: stars and Google rating (Chinese)"
        type: text
      - name: starsTextYue
        label: "Method: stars and Google rating (Cantonese)"
        type: text
      - name: starsTextFr
        label: "Method: stars and Google rating (French)"
        type: text
      - name: starsTextEs
        label: "Method: stars and Google rating (Spanish)"
        type: text
      - name: starsTextIt
        label: "Method: stars and Google rating (Italian)"
        type: text
      - name: starsTextKo
        label: "Method: stars and Google rating (Korean)"
        type: text
      - name: starsTextJa
        label: "Method: stars and Google rating (Japanese)"
        type: text

  - name: currencies
    label: Currencies
    description: Symbols and fallback exchange rates. Live rates are used when available; these only apply if they can't be fetched.
    type: file
    path: content/currencies.json
    format: json
    fields:
      - name: rateDate
        label: Date of the fallback rates
        type: string
        pattern: { regex: '^\d{4}-\d{2}-\d{2}$', message: "Use year-month-day, e.g. 2026-10-02" }
      - name: switchable
        label: Currencies in the switch
        description: Shown on every page after the local currency, e.g. GBP, EUR, USD.
        type: string
        list: true
      - name: currencies
        label: Currencies
        type: object
        list: true
        fields:
          - name: code
            label: Code
            type: string
            required: true
            pattern: { regex: '^[A-Z]{3}$', message: "Use a three-letter code in capitals, e.g. EUR" }
          - name: symbol
            label: Symbol
            description: e.g. £, €, US$, NT$, ¥, DKK. A symbol made of letters (like DKK) gets a space before the amount.
            type: string
            required: true
          - name: perUSD
            label: Units per 1 US dollar
            description: e.g. 0.76 for pounds, 32 for New Taiwan dollars.
            type: number
            required: true
            options: { min: 0, step: any }

  - name: site
    label: Site settings
    type: file
    path: content/site.json
    format: json
    fields:
      - name: updated
        label: Prices last checked
        description: Year and month, shown on the homepage, e.g. 2026-10.
        type: string
        pattern: { regex: '^\d{4}-\d{2}$', message: "Use year-month, e.g. 2026-10" }
