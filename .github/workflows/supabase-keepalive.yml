# Supabase pauses free projects after about a week without activity, which would stop sign-in and saved lists.
# Every three days this asks the database one tiny question with the site's public key (the same one the
# pages use). Visitors who aren't signed in may not read the table, so the database answers "permission denied"
# (code 42501): that answer still comes from the database itself, which is the activity Supabase looks for.
name: Keep Supabase awake
on:
  schedule:
    - cron: "17 6 */3 * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Ask the database one question
        run: |
          URL=$(grep -o 'SUPABASE_URL = "[^"]*"' src/assets/account.js | cut -d'"' -f2)
          KEY=$(grep -o 'SUPABASE_KEY = "[^"]*"' src/assets/account.js | cut -d'"' -f2)
          body=$(curl -s "$URL/rest/v1/saved?select=restaurant_id&limit=1" -H "apikey: $KEY" -H "Authorization: Bearer $KEY")
          echo "Supabase answered: $body"
          echo "$body" | grep -q -e '42501' -e '^\['
